services:
  # ─── Node.js Express Backend Service ──────────────────────────────────────
  # In Production on EC2, this connects directly to AWS RDS MySQL 8.0
  # using the DB_HOST, DB_USER, DB_PASSWORD configured in backend/.env
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fundit-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  # ─── React / Nginx Frontend Service ───────────────────────────────────────
  # Serves the compiled production React SPA and reverse-proxies /api/ to backend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fundit-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

  # ─── Optional Local MySQL Database (Local PC Testing Only) ────────────────
  # Activate with: docker compose --profile local up -d
  # In AWS Production with RDS, this container is NOT started, saving 100% of EC2 RAM & CPU.
  mysql:
    image: mysql:8.0
    container_name: fundit-mysql
    restart: always
    profiles:
      - local
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-fundit_secret_pass}
      MYSQL_DATABASE: ${DB_NAME:-fundit_db}
      MYSQL_USER: ${DB_USER:-fundit_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fundit_secret_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-fundit_secret_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local
